<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Citizenship Test Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f2e9; --card:#fffdf8; --ink:#1c2541; --muted:#5b6275; --line:#e3dccb;
    --navy:#1d2b4f; --red:#b0383a; --red-soft:#f6e1df; --green:#2e7d4f; --green-soft:#dff0e5;
    --gold:#c99a2e; --radius:16px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,sans-serif;font-size:19px;line-height:1.45}
  button{font:inherit;cursor:pointer}
  .wrap{max-width:680px;margin:0 auto;padding:18px 16px 60px}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
  .brand{display:flex;align-items:center;gap:12px;cursor:pointer}
  .seal{width:46px;height:46px;flex:none}
  h1{font-family:Fraunces,serif;font-size:1.35rem;margin:0;line-height:1.1;color:var(--navy)}
  .sub{font-size:.8rem;color:var(--muted);margin-top:2px}
  .iconbtn{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;color:var(--navy);font-weight:700}
  h2{font-family:Fraunces,serif;color:var(--navy);font-size:1.5rem;margin:6px 0 14px}
  .card{background:var(--card);border:1.5px solid var(--line);border-radius:var(--radius);padding:18px}
  .stripe{height:6px;border-radius:6px;background:repeating-linear-gradient(90deg,var(--red) 0 22px,#fff 22px 30px,var(--navy) 30px 52px,#fff 52px 60px);opacity:.85;margin-bottom:18px}
  .menu{display:grid;gap:12px}
  .menu button{display:flex;align-items:center;gap:16px;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:var(--radius);padding:18px;color:var(--ink);transition:transform .08s,border-color .15s}
  .menu button:active{transform:scale(.985)}
  .menu button:hover{border-color:var(--navy)}
  .menu .ico{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:1.6rem;flex:none}
  .menu b{display:block;font-size:1.1rem;color:var(--navy)}
  .menu span.d{font-size:.88rem;color:var(--muted)}
  .meter{height:14px;background:#ebe5d6;border-radius:10px;overflow:hidden}
  .meter i{display:block;height:100%;background:linear-gradient(90deg,var(--navy),#3a5a9b);border-radius:10px;transition:width .4s}
  .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .small{font-size:.85rem;color:var(--muted)}
  .pill{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--red);background:var(--red-soft);padding:3px 10px;border-radius:99px}
  .qtext{font-size:1.45rem;font-weight:700;line-height:1.3;margin:14px 0 6px;color:var(--navy)}
  .btn{display:block;width:100%;border:none;border-radius:14px;padding:16px;font-weight:700;font-size:1.05rem}
  .btn.primary{background:var(--navy);color:#fff}
  .btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--navy)}
  .btn.ok{background:var(--green);color:#fff}
  .btn.no{background:var(--red);color:#fff}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .stack>*+*{margin-top:12px}
  .speak{background:#eef1f8;border:none;color:var(--navy);border-radius:99px;padding:8px 16px;font-weight:700;font-size:.92rem}
  .answers{background:#f3efe4;border-radius:12px;padding:12px 16px;margin:0}
  .answers li{margin:4px 0 4px 18px}
  .answers .lbl{font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;margin-bottom:4px}
  .warn{color:var(--red);font-weight:700}
  .opt{display:block;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:10px;color:var(--ink);font-size:1.02rem}
  .opt.right{border-color:var(--green);background:var(--green-soft)}
  .opt.wrong{border-color:var(--red);background:var(--red-soft)}
  .opt:disabled{cursor:default;color:var(--ink)}
  .progress-top{display:flex;justify-content:space-between;font-size:.9rem;color:var(--muted);margin-bottom:8px}
  .result{text-align:center;padding:26px 18px}
  .big{font-family:Fraunces,serif;font-size:3.2rem;color:var(--navy);line-height:1}
  .verdict{font-size:1.4rem;font-weight:700;margin-top:10px}
  .verdict.pass{color:var(--green)} .verdict.fail{color:var(--red)}
  .chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}
  .chip{flex:none;border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:6px 14px;font-size:.88rem;color:var(--navy)}
  .chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  input[type=text],input[type=search]{width:100%;font:inherit;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
  label{display:block;font-weight:700;font-size:.92rem;margin:14px 0 6px;color:var(--navy)}
  .hint{font-size:.82rem;color:var(--muted);margin-top:4px}
  .studyq{border-bottom:1px solid var(--line);padding:14px 0}
  .studyq:last-child{border-bottom:none}
  .studyq .n{color:var(--muted);font-size:.8rem;font-weight:700}
  .studyq .q{font-weight:700;color:var(--navy);margin:2px 0 6px}
  .studyq ul{margin:0;padding-left:22px}
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-left:6px;vertical-align:middle}
  .secbar{margin:12px 0}
  .missed{text-align:left;margin-top:18px}
  .missed .item{background:#f3efe4;border-radius:12px;padding:12px 14px;margin-top:10px}
  .missed .item b{color:var(--navy)}
  .modal{position:fixed;inset:0;background:rgba(20,25,40,.45);display:grid;place-items:center;padding:20px;z-index:10}
  .modal .card{max-width:420px;width:100%}
  a{color:var(--navy)}
  .hide{display:none!important}
</style>
</head>

function buildQ(){
  const v08 = settings.version!=="2025";
  SECTIONS = v08 ? SECTIONS_08 : SECTIONS_25;
  const pre = v08 ? "08-" : "25-";
  let all = (v08?RAW_08:RAW_25).split("\n").map((line,i)=>{
    const [sec,q,a,star]=line.split("|");
    const v = a.startsWith("@") ? a.slice(1) : null;
    const multi = /Name (two|three|five)|What are (two|three)/.test(q);
    return {id:pre+(i+1), n:i+1, sec, q, a: v?[]:a.split(";"), v, multi, star:star==="*"};
  });
  const senior = v08 && settings.senior;
  if(senior) all = all.filter(q=>q.star);
  Q = all;
  TEST = v08 ? {name:"2008", ask:10, pass:6, senior} : {name:"2025", ask:20, pass:12, senior:false};
}

function answersFor(q){

/* ===== Rotation: weighted toward missed & unseen ===== */
function weight(id){
  const s=stats[id];
  if(!s) return 3;
  let w = 1 + s.w*1.5 - Math.min(s.s,3)*0.35;
  if(s.s>=3) w=0.35;
  return Math.max(0.3,w);
}
function pick(pool,k){
  const items=pool.slice(), out=[];
  while(out.length<k && items.length){
    const ws=items.map(q=>weight(q.id)), tot=ws.reduce((a,b)=>a+b,0);
    let r=Math.random()*tot, i=0;
    while(r>ws[i]){ r-=ws[i]; i++; }
    out.push(items.splice(Math.min(i,items.length-1),1)[0]);
  }
  return out;
}
function record(id,ok){
  const s=stats[id]||{r:0,w:0,s:0};
  if(ok){ s.r++; s.s=Math.max(0,s.s)+1; } else { s.w++; s.s=0; }
  stats[id]=s; store.set("stats",stats);
}
const mastered = id => (stats[id]?.s||0)>=2;

function freshPick(key, arr, n){
  const recent=store.get("recent_"+key,[]);
  let pool=arr.filter(x=>!recent.includes(x));
  if(pool.length<n) pool=arr.slice();
  const out=shuffle(pool.slice()).slice(0,n);
  store.set("recent_"+key, [...out, ...recent].slice(0, Math.max(0, arr.length-n)));
  return out;
}

/* finger-writing pad */
let padImg=null;
function setupPad(){
  const c=document.getElementById("pad"); if(!c) return;
  const r=c.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
  c.width=r.width*dpr; c.height=r.height*dpr;
  const x=c.getContext("2d"); x.scale(dpr,dpr);
  x.strokeStyle="#e8e2d2"; x.lineWidth=1;
  for(let y=60;y<r.height;y+=60){ x.beginPath(); x.moveTo(12,y); x.lineTo(r.width-12,y); x.stroke(); }
  if(padImg){ const im=new Image(); im.onload=()=>x.drawImage(im,0,0,r.width,r.height); im.src=padImg; }
  x.strokeStyle="#1c2541"; x.lineWidth=3; x.lineCap="round"; x.lineJoin="round";
  let down=false;
  const pt=e=>{ const b=c.getBoundingClientRect(); return [e.clientX-b.left,e.clientY-b.top]; };
  c.onpointerdown=e=>{ down=true; c.setPointerCapture(e.pointerId); const [a,b]=pt(e); x.beginPath(); x.moveTo(a,b); };
  c.onpointermove=e=>{ if(!down) return; const [a,b]=pt(e); x.lineTo(a,b); x.stroke(); };
  c.onpointerup=c.onpointercancel=()=>{ down=false; };
}
function keepPad(){ const c=document.getElementById("pad"); try{ padImg=c.toDataURL(); }catch(e){} render(); }
function clearPad(){ padImg=null; setupPad(); }

function engGrade(ok){ if(ok) state.score++; state.i++; state.heard=false; state.shown=false; padImg=null; window.scrollTo(0,0); render(); }
function engResult(kind, again){

    <div class="two" style="margin-top:22px"><button class="btn ghost" onclick="go('home')">Home</button><button class="btn primary" id="again">Try again</button></div></div>`;
  document.getElementById("again").onclick=again;
}

/* --- Practice interview (oral, self-graded) --- */
function startInterview(){
  go("interview",true);
  state.qs=shuffle(pick(Q,TEST.ask)); state.i=0; state.score=0; state.missed=[]; state.shown=false;
  render();
}
function interview(){
  const {qs,i}=state;
  if(i>=qs.length){
    const pass=state.score>=TEST.pass;
    $app.innerHTML=`<div class="card result">
      <div class="small">Your score</div>
      <div class="big">${state.score} / ${state.qs.length}</div>
      <div class="verdict ${pass?"pass":"fail"}">${pass?"🎉 You passed!":`Keep practicing — you need ${TEST.pass}.`}</div>
      ${state.missed.length?`<div class="missed"><b style="color:var(--navy)">Review these:</b>${state.missed.map(q=>`<div class="item"><b>${esc(q.q)}</b><div style="margin-top:6px">${(answersFor(q)||["(set in Settings)"]).slice(0,3).map(esc).join(" · ")}</div></div>`).join("")}</div>`:""}
      <div class="two" style="margin-top:22px"><button class="btn ghost" onclick="go('home')">Home</button><button class="btn primary" onclick="startInterview()">New test</button></div>
    </div>`;
    return;
  }
  const q=qs[i];
  $app.innerHTML=`
  <div class="progress-top"><span>Question ${i+1} of ${qs.length}</span><span>✓ ${state.score} right</span></div>
  <div class="meter" style="margin-bottom:16px"><i style="width:${i/qs.length*100}%"></i></div>
  <div class="card stack">
    <span class="pill">${SECTIONS[q.sec]}</span>
    <div class="qtext">${esc(q.q)}</div>
    <div>${speakBtn(q.q)}</div>
    ${state.shown ? `${answerBlock(q)}
      <div class="small">Did you say one of these?</div>
      <div class="two"><button class="btn no" onclick="grade(false)">✗ Missed it</button><button class="btn ok" onclick="grade(true)">✓ Got it</button></div>`
    : `<p class="small" style="margin:6px 0 0">Say your answer out loud, then check.</p>
      <button class="btn primary" onclick="state.shown=true;render()">Show answer</button>`}
  </div>
  <button class="btn ghost" style="margin-top:14px" onclick="go('home')">Quit</button>`;
  if(i===0 && !state.shown) {/* no autoplay — speech needs a tap */}
}
function grade(ok){
  const q=state.qs[state.i];
  record(q.id,ok);
  if(ok) state.score++; else state.missed.push(q);
  state.i++; state.shown=false; window.scrollTo(0,0); render();
}

/* --- Multiple choice --- */
function mcPool(){ return Q.filter(q=>!q.multi && answersFor(q)); }
function makeOptions(q){
  const ans=answersFor(q);
  const correct=ans[Math.floor(Math.random()*ans.length)];
  const bad=new Set(ans.map(norm));
  const group=q.sec[0];
  const cands=shuffle(mcPool().filter(o=>o.id!==q.id)).sort((a,b)=>(b.sec===q.sec)-(a.sec===q.sec)||(b.sec[0]===group)-(a.sec[0]===group));
  const opts=[];
  for(const o of cands){
    const oa=answersFor(o); const pickA=oa[Math.floor(Math.random()*oa.length)];
    const n=norm(pickA);
    if(bad.has(n)) continue;
    bad.add(n); opts.push(pickA);
    if(opts.length===3) break;
  }
  return {correct, opts:shuffle([correct,...opts])};
}
function startMC(){
  go("mc",true);
  state.qs=shuffle(pick(mcPool(),10)).map(q=>({q,...makeOptions(q)}));
  state.i=0; state.score=0; state.chosen=null;
  render();
}
function mc(){
  const {qs,i}=state;
  if(i>=qs.length){
    $app.innerHTML=`<div class="card result">
      <div class="small">Your score</div><div class="big">${state.score} / 10</div>
      <div class="verdict ${state.score>=6?"pass":"fail"}">${state.score>=8?"Excellent!":state.score>=6?"Nice work!":"Keep going — you're learning."}</div>
      <div class="two" style="margin-top:22px"><button class="btn ghost" onclick="go('home')">Home</button><button class="btn primary" onclick="startMC()">Play again</button></div></div>`;
    return;
  }
  const it=qs[i], done=state.chosen!==null;
  $app.innerHTML=`
  <div class="progress-top"><span>Question ${i+1} of 10</span><span>✓ ${state.score} right</span></div>
  <div class="meter" style="margin-bottom:16px"><i style="width:${i/10*100}%"></i></div>
  <div class="card">
    <span class="pill">${SECTIONS[it.q.sec]}</span>
    <div class="qtext">${esc(it.q.q)}</div>
    <div>${speakBtn(it.q.q)}</div>
    ${it.opts.map((o,k)=>{
      let cls=""; if(done){ if(o===it.correct) cls="right"; else if(k===state.chosen) cls="wrong"; }
      return `<button class="opt ${cls}" ${done?"disabled":""} onclick="choose(${k})">${esc(o)}</button>`;
    }).join("")}
    ${done?`<div style="margin-top:16px">${answerBlock(it.q)}</div><button class="btn primary" style="margin-top:14px" onclick="state.i++;state.chosen=null;window.scrollTo(0,0);render()">Next →</button>`:""}
  </div>
  <button class="btn ghost" style="margin-top:14px" onclick="go('home')">Quit</button>`;
}
function choose(k){
  const it=state.qs[state.i]; const ok=it.opts[k]===it.correct;
  state.chosen=k; record(it.q.id,ok); if(ok) state.score++; render();
}

/* --- Study --- */
function study(){
  state.filter=state.filter||"all"; state.search=state.search||"";
  const f=state.filter, s=state.search.toLowerCase();
  const list=Q.filter(q=>(f==="all"||q.sec===f||(f==="miss"&&stats[q.id]&&!mastered(q.id)&&stats[q.id].w>0)) &&
    (!s || q.q.toLowerCase().includes(s) || (answersFor(q)||[]).join(" ").toLowerCase().includes(s)));
  const chips=[["all","All"],["miss","Needs practice"],...Object.entries(SECTIONS)];
  $app.innerHTML=`<h2>Study all questions</h2>
  <div class="chips">${chips.map(([k,l])=>`<button class="chip ${f===k?"on":""}" onclick="state.filter='${k}';study()">${l}</button>`).join("")}</div>
  <input type="search" placeholder="Search questions or answers…" value="${esc(state.search)}" oninput="state.search=this.value;studyList()">
  <button class="chip ${state.mix?"on":""}" style="margin-top:10px" onclick="state.mix=!state.mix;state.rank=Object.fromEntries(Q.map(q=>[q.id,Math.random()]));study()">🔀 ${state.mix?"Mixed order — tap for normal order":"Mix up the order"}</button>
  <div class="card" id="slist" style="margin-top:12px;padding-top:4px;padding-bottom:4px"></div>`;
  studyList(list);
}
function studyList(list){
  if(!list){ const f=state.filter, s=state.search.toLowerCase();
    list=Q.filter(q=>(f==="all"||q.sec===f||(f==="miss"&&stats[q.id]&&!mastered(q.id)&&stats[q.id].w>0)) &&
      (!s || q.q.toLowerCase().includes(s) || (answersFor(q)||[]).join(" ").toLowerCase().includes(s))); }
  if(state.mix&&state.rank){ list=list.slice().sort((a,b)=>state.rank[a.id]-state.rank[b.id]); }
  const el=document.getElementById("slist");
  if(!list.length){ el.innerHTML=`<p class="small" style="padding:10px 0">No questions here yet.</p>`; return; }
  el.innerHTML=list.map(q=>{
    const st=stats[q.id]; const dot=!st?"":mastered(q.id)?`<span class="dot" style="background:var(--green)" title="Learned"></span>`:st.w?`<span class="dot" style="background:var(--red)" title="Needs practice"></span>`:"";
    const a=answersFor(q);
    return `<div class="studyq"><div class="n">#${q.n} · ${SECTIONS[q.sec]}${dot}</div><div class="q">${esc(q.q)}</div>
    ${a?`<ul>${a.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:`<div class="warn" style="font-size:.9rem">Not set — add in Settings ⚙︎</div>`}
    ${canSpeak?`<div style="margin-top:8px">${speakBtn(q.q)}</div>`:""}</div>`;
  }).join("");
}

/* --- Progress --- */
function progress(){
  const m=Q.filter(q=>mastered(q.id)).length, seen=Q.filter(q=>stats[q.id]).length;
  const trouble=Q.filter(q=>stats[q.id]&&stats[q.id].w>0&&!mastered(q.id)).sort((a,b)=>stats[b.id].w-stats[a.id].w).slice(0,15);
  $app.innerHTML=`<h2>My progress</h2>
  <div class="card stack">
    <div class="row"><b>Learned</b><span>${m} / ${Q.length}</span></div><div class="meter"><i style="width:${m/Q.length*100}%"></i></div>
    <div class="row"><b>Practiced at least once</b><span>${seen} / ${Q.length}</span></div><div class="meter"><i style="width:${seen/Q.length*100}%;background:var(--gold)"></i></div>
  </div>
  <div class="card" style="margin-top:14px">
    <b style="color:var(--navy)">By topic</b>
    ${Object.entries(SECTIONS).map(([k,l])=>{const qs=Q.filter(q=>q.sec===k), mm=qs.filter(q=>mastered(q.id)).length;
      return `<div class="secbar"><div class="row small"><span>${l}</span><span>${mm}/${qs.length}</span></div><div class="meter" style="height:10px"><i style="width:${mm/qs.length*100}%"></i></div></div>`}).join("")}
  </div>
  <div class="card" style="margin-top:14px">
    <b style="color:var(--navy)">Needs practice</b>
    ${trouble.length?trouble.map(q=>`<div class="studyq"><div class="q">${esc(q.q)}</div><div class="small">Missed ${stats[q.id].w}×</div></div>`).join(""):`<p class="small">Nothing yet — questions you miss will show up here.</p>`}
  </div>
  <button class="btn ghost" style="margin-top:14px" onclick="confirmReset()">Reset progress</button>`;
}
function confirmReset(){
  document.getElementById("modal").innerHTML=`<div class="modal" onclick="if(event.target===this)this.parentNode.innerHTML=''"><div class="card stack">
    <b style="color:var(--navy);font-size:1.1rem">Reset all progress?</b><div class="small">This clears every score on this device. Settings are kept.</div>
    <div class="two"><button class="btn ghost" onclick="document.getElementById('modal').innerHTML=''">Cancel</button>
    <button class="btn no" onclick="stats={};store.set('stats',stats);document.getElementById('modal').innerHTML='';progress()">Reset</button></div></div></div>`;
}

/* --- Settings --- */
function settingsView(){
  $app.innerHTML=`<h2>Settings</h2>
  <div class="card">
    <div class="small">Some answers change with elections or depend on where she lives. Fill these in once — they're saved on this device. Double-check them at <a href="https://www.uscis.gov/citizenship/testupdates">uscis.gov/citizenship/testupdates</a> before the interview.</div>
    <label>Which test is she taking?</label>
    <div class="two">
      <button type="button" class="chip ${settings.version!=="2025"?"on":""}" style="padding:12px" onclick="setVersion('2008')">2008 test<br><span style="font-size:.75rem">100 questions · filed before Oct 20, 2025</span></button>
      <button type="button" class="chip ${settings.version==="2025"?"on":""}" style="padding:12px" onclick="setVersion('2025')">2025 test<br><span style="font-size:.75rem">128 questions · filed Oct 20, 2025 or later</span></button>
    </div>
    ${settings.version!=="2025"?`<label style="display:flex;gap:10px;align-items:flex-start;font-weight:400;color:var(--ink)"><input type="checkbox" id="f_senior" ${settings.senior?"checked":""} style="width:22px;height:22px;margin-top:2px"> <span><b style="color:var(--navy)">65/20 version</b> — only the 20 starred questions. For people 65 or older who have had a green card for 20+ years.</span></label>`:""}
    ${VAR_FIELDS.filter(f=>!f.v08||settings.version!=="2025").map(f=>`<label for="f_${f.k}">${f.label}</label><input type="text" id="f_${f.k}" value="${esc(settings[f.k]||"")}" placeholder="${f.k==="senators"?"e.g. First Last, First Last":""}">${f.hint?`<div class="hint">${f.hint}</div>`:""}`).join("")}
    <button class="btn primary" style="margin-top:20px" onclick="saveSettings()">Save</button>
    <div id="saved" class="small" style="text-align:center;margin-top:8px"></div>
  </div>`;
}
function setVersion(v){ settings.version=v; if(v==='2025') settings.senior=false; store.set('settings',settings); buildQ(); settingsView(); }
function saveSettings(){
  VAR_FIELDS.forEach(f=>{ const el=document.getElementById("f_"+f.k); if(el) settings[f.k]=el.value.trim(); });
  const sn=document.getElementById("f_senior"); settings.senior = settings.version!=="2025" && !!(sn&&sn.checked);
  buildQ();
  store.set("settings",settings);
  document.getElementById("saved").textContent="Saved ✓";
  setTimeout(()=>go("home"),600);
}

go("home");
</script>
